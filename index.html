<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VER.AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent polyfills from crashing the app due to window.fetch getter-only properties in strict iframes
      const originalFetch = window.fetch;
      try {
        Object.defineProperty(window, 'fetch', {
          get: () => originalFetch,
          set: () => { /* safely ignore polyfill overrides */ },
          configurable: true
        });
      } catch (e) {
        // ignore if already defined
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
